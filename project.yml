name: Streami
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.example.streami
    GENERATE_INFOPLIST_FILE: YES
packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: 8.0.0
  lottie-spm:
    url: https://github.com/airbnb/lottie-spm.git
    from: 4.6.1
targets:
  Streami:
    type: application
    platform: iOS
    sources:
      - path: Streami
        excludes:
          - Resources/**
          - DetailView.swift
          - StreamingPlayerView.swift
          - StreamingSources.swift
      - path: Streami/Resources
        buildPhase: resources
    dependencies:
      - package: Kingfisher
        product: Kingfisher
      - package: lottie-spm
        product: Lottie
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: Streami
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        SWIFT_OBJC_BRIDGING_HEADER: Streami/RecommendationBridge.h
    scheme:
      testTargets:
        - StreamiTests
  StreamiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StreamiTests
    dependencies:
      - target: Streami